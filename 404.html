  <style>
    /* Styles spécifiques pour centrer la page 404 */
    body {
      background-color: var(--light-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .error-container {
      max-width: 600px;
      padding: 40px;
      background: white;
      border-radius: var(--border-radius-soft);
      box-shadow: var(--shadow-soft);
      border-top: 5px solid var(--accent-orange);
      animation: reveal-up 0.8s ease;
    }

    .error-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 8rem;
      font-weight: 900;
      color: var(--primary-green);
      line-height: 1;
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    /* Petite animation du tracteur sur le 404 */
    .tractor-icon {
      font-size: 3rem;
      color: var(--accent-orange);
      position: absolute;
      top: -20px;
      right: -20px;
      transform: rotate(15deg);
      animation: float 3s ease-in-out infinite;
    }

    h2 {
      color: var(--text-dark);
      font-size: 2rem;
      margin-bottom: 20px;
    }

    p {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    /* Animation simple */
    @keyframes reveal-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: rotate(15deg) translateY(0); }
      50% { transform: rotate(15deg) translateY(-10px); }
    }
  </style>
</head>
